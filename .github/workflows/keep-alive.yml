name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity.
# This sends one small request twice a week so the project stays up.
# The key below is the public anon key (it is already shipped in the website).
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error --max-time 30             -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYmxlcWxvb2VhZXRwYmVsaHZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTM1NjMsImV4cCI6MjEwMTk2OTU2M30.9XPjRgJh3rEuuX-fV0ZrtRiUnahfP8yl8yerzoSsnLk"             "https://kibleqlooeaetpbelhve.supabase.co/rest/v1/program?select=id&limit=1" > /dev/null
